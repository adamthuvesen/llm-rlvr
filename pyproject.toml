[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-rlvr"
version = "0.1.0"
description = "Reusable RLVR library for LLM post-training, with text-to-SQL as the reference task."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Adam Thuvesen", email = "adam.thuvesen@mentimeter.com" }]

# The CPU eval/verifier/data layer. Deliberately light so the whole Stage-0 foundation
# installs and tests on a CPU box without the GPU training stack.
dependencies = [
    "pydantic>=2.7,<3",
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    # The vendored Test-Suite SQL Eval (third_party/) imports these two; everything else
    # it needs is stdlib. nltk/process_sql.py (component match) is NOT vendored — we only
    # use the execution-match path.
    "sqlparse>=0.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Completion generation. transformers+torch only, so the base-model baseline can run on a
# Mac/CPU box for a dev slice; the vLLM GPU backend is imported lazily and ships with `gpu`.
generate = [
    "transformers>=4.48",
    "torch>=2.4",
]
gpu = [
    "llm-rlvr[generate]",
    "vllm",
]
# Stage-1 LoRA SFT (TRL + PEFT) on top of the GPU stack. Locked working triple (2026-06):
# trl 1.5.1 / peft 0.19.1 / accelerate 1.13.0 against transformers 5.10.2 / vllm 0.22.1 /
# torch 2.11.0 — resolution verified against the training stack.
train = [
    "llm-rlvr[gpu]",
    "trl>=1.3",
    "peft>=0.14",
    "accelerate>=1.0",
]
dev = [
    "basedpyright==1.40.2",
    "pytest>=9.1.1",
    "ruff==0.17.4",
    "pre-commit>=3.8",
    # The Modal launch CLI. Pinned so `modal run`/`modal deploy` use the surface modal_app.py
    # targets (modal.App, string GPU, add_local_*); it never enters the GPU image (the image
    # exports only `--extra train`, which includes `gpu`), so it adds no runtime weight to the box.
    "modal==1.5.0",
    "import-linter>=2.15",
    "hatchling>=1.33.0",
    "pytest-xdist>=3.6",
    "pytest-socket>=0.7",
]
adapters = [
    "llm-rlvr[generate]",
    "peft>=0.14",
]

[project.scripts]
llm-rlvr = "llm_rlvr.cli:main"

[tool.ruff]
line-length = 100
target-version = "py314"
# The vendored evaluator is upstream code; do not lint or reformat it.
extend-exclude = ["src/llm_rlvr/third_party"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "N", "PTH", "RUF", "PGH003"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llm_rlvr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration and not runtime' --disable-socket --allow-unix-socket"
strict_markers = true
markers = [
    "integration: hits the network or HuggingFace (deselected by default)",
    "slow: large dataset download (compose with integration)",
    "runtime: requires installed optional training dependencies and never silently skips",
]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["src/llm_rlvr", "scripts", "tests", "examples", "modal_app.py"]
# Vendored upstream code is untyped and excluded from checking.
exclude = ["src/llm_rlvr/third_party", "**/__pycache__", ".venv", ".verify"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

# The GPU libraries (torch, transformers, peft, trl, vllm) are optional and absent from the CPU environment.
[[tool.basedpyright.executionEnvironments]]
root = "src/llm_rlvr/eval"
reportMissingImports = false

[[tool.basedpyright.executionEnvironments]]
root = "src/llm_rlvr/train"
reportMissingImports = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

[tool.hatch.build.targets.wheel]
packages = ["src/llm_rlvr"]

[tool.uv.sources]
llm-rlvr = { workspace = true }

[tool.importlinter]
root_package = "llm_rlvr"

[[tool.importlinter.contracts]]
name = "Harness stays independent of tasks and execution"
type = "forbidden"
source_modules = ["llm_rlvr.harness"]
forbidden_modules = ["llm_rlvr.data", "llm_rlvr.env", "llm_rlvr.tasks", "llm_rlvr.eval", "llm_rlvr.train", "llm_rlvr.report"]

[[tool.importlinter.contracts]]
name = "SQL task stays independent of evaluation and training"
type = "forbidden"
source_modules = ["llm_rlvr.tasks.sql"]
forbidden_modules = ["llm_rlvr.eval", "llm_rlvr.train", "llm_rlvr.report"]

[[tool.importlinter.contracts]]
name = "Shared artifacts stay independent of task and data owners"
type = "forbidden"
source_modules = ["llm_rlvr.artifacts"]
forbidden_modules = ["llm_rlvr.data", "llm_rlvr.env", "llm_rlvr.tasks", "llm_rlvr.eval", "llm_rlvr.train", "llm_rlvr.report"]

[[tool.importlinter.contracts]]
name = "Prepared training stays independent of SQL composition"
type = "forbidden"
source_modules = ["llm_rlvr.train.prepared", "llm_rlvr.train.configuration", "llm_rlvr.train.checkpoints"]
forbidden_modules = ["llm_rlvr.data", "llm_rlvr.env", "llm_rlvr.tasks", "llm_rlvr.eval", "llm_rlvr.report", "llm_rlvr.train.sft", "llm_rlvr.train.grpo", "llm_rlvr.train.traces"]
