# Owners of a banned module (see tests/test_banned_modules.py::OWNERS).
[tool.ruff.lint.per-file-ignores]
"src/llm_rlvr/artifacts/provenance.py" = ["TID251"]
"src/llm_rlvr/data/installation.py" = ["TID251"]
"src/llm_rlvr/data/spider.py" = ["TID251"]
"src/llm_rlvr/train/configuration.py" = ["TID251"]
"src/llm_rlvr/train/prepared.py" = ["TID251"]
"scripts/verify_package.py" = ["TID251"]
"modal_app.py" = ["TID251"]
"tests/test_import_architecture.py" = ["TID251"]
"tests/test_repo_rules.py" = ["TID251"]
"tests/test_strict_mode.py" = ["TID251"]
".agents/skills/verify-llm-rlvr/drives.py" = ["TID251"]
".agents/skills/verify-llm-rlvr/launch_plan.py" = ["TID251"]
".agents/skills/verify-llm-rlvr/verify" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["llm_rlvr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration and not runtime' --disable-socket --allow-unix-socket"
strict_markers = true
markers = [
    "integration: hits the network or HuggingFace (deselected by default)",
    "slow: large dataset download (compose with integration)",
    "runtime: requires installed optional training dependencies and never silently skips",
]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
pythonVersion = "3.14"
include = ["src/llm_rlvr", "scripts", "tests", "examples", "modal_app.py"]
# Vendored upstream code is untyped and excluded from checking.
exclude = ["src/llm_rlvr/third_party", "**/__pycache__", ".venv", ".verify"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

# The GPU libraries (torch, transformers, peft, trl, vllm) are optional and absent from the CPU environment.
[[tool.basedpyright.executionEnvironments]]
root = "src/llm_rlvr/eval"
reportMissingImports = false

[[tool.basedpyright.executionEnvironments]]
root = "src/llm_rlvr/generation"
reportMissingImports = false

[[tool.basedpyright.executionEnvironments]]
root = "src/llm_rlvr/train"
reportMissingImports = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

[tool.hatch.build.targets.wheel]
packages = ["src/llm_rlvr"]

[tool.uv.sources]
llm-rlvr = { workspace = true }

[tool.importlinter]
root_package = "llm_rlvr"

[[tool.importlinter.contracts]]
name = "llm_rlvr modules import only lower layers; move shared code to a lower layer such as _base"
type = "layers"
containers = ["llm_rlvr"]
exhaustive = true
layers = [
    "cli",
    "modal_helpers",
    "report",
    "eval | train",
    "generation",
    "tasks",
    "data",
    "artifacts | env | harness | third_party",
    "_base",
]

[[tool.importlinter.contracts]]
name = "Prepared training must not import SQL, eval, report, or SFT and GRPO code; pass inputs in from the caller"
type = "forbidden"
source_modules = ["llm_rlvr.train.prepared", "llm_rlvr.train.configuration", "llm_rlvr.train.checkpoints"]
forbidden_modules = ["llm_rlvr.data", "llm_rlvr.env", "llm_rlvr.tasks", "llm_rlvr.eval", "llm_rlvr.report", "llm_rlvr.train.sft", "llm_rlvr.train.grpo", "llm_rlvr.train.traces"]
