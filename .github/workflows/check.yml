name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          version: "0.13.5"
          python-version: '3.14'
      - name: Install locked CPU development dependencies
        run: uv sync --locked --extra dev
      - name: Check lock, lint, types, imports, tests, and the installed wheel
        run: make check

  verify:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
          version: "0.13.5"
          python-version: '3.14'
      - name: Install locked CPU development dependencies
        run: uv sync --locked --extra dev
      - name: Drive the real CLI and Modal launcher
        run: make slow
